name: generate arcade contribution graphs

on:
  schedule: # otomatis tiap 24 jam
    - cron: "0 */24 * * *"
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push: # jalan setiap push ke main
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # daftar game dipisah koma (default: pacman)
          games: 'pacman'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
